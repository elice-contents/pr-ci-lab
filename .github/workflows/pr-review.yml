name: Booking PR checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: booking-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Load proposed booking code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check ticket availability calculation
        run: python tools/local_tests.py
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-test-results
          path: |
            output/tests.log
            output/tests.json
